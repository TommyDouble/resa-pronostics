<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}RESA Pronostics 2026{% endblock %}</title>
<meta name="theme-color" content="#D3450D">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RESA Pronos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/resa.css?v={{ static_version }}">
{% block head %}{% endblock %}
</head>
<body data-token="{{ token or '' }}">

{% if flashes is defined and flashes %}
<div class="flash">
  {% for f in flashes %}
  <div class="flash-msg {{ f.kind }}">{{ f.msg }}</div>
  {% endfor %}
</div>
{% endif %}

{% block body %}{% endblock %}

<script src="/static/js/resa.js?v={{ static_version }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
