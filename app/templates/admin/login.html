<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — RESA Pronostics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/resa.css">
</head>
<body>
<div class="onboard-wrap">
  <div class="onboard-card" style="max-width:360px;">
    <div class="logo-icon"><span>R</span></div>
    <h1 style="font-family:var(--display);font-weight:800;font-size:26px;margin:0;">
      Backoffice RESA
    </h1>
    {% if error %}
    <div class="banner red"><span>⚠</span> {{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/login" style="display:flex;flex-direction:column;gap:12px;text-align:left;">
      <div>
        <div class="lbl" style="margin-bottom:6px;">Identifiant</div>
        <div class="field"><input type="text" name="username" placeholder="admin" required autofocus></div>
      </div>
      <div>
        <div class="lbl" style="margin-bottom:6px;">Mot de passe</div>
        <div class="field"><input type="password" name="password" required></div>
      </div>
      <button class="btn full" type="submit" style="margin-top:4px;">Se connecter</button>
    </form>
  </div>
</div>
<script src="/static/js/resa.js"></script>
</body>
</html>
